<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Maths Practice</title>
    
    <!-- Local Self-Hosted Tailwind CSS -->
    <link rel="stylesheet" href="./tailwind.min.css">
    
    <!-- PyScript & MicroPython -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    
    <style>
        body { font-family: 'Courier New', Courier, monospace; }
        body { transition: opacity 0.3s; } 
    </style>
</head>
<body class="bg-gray-50 text-gray-900 m-0 p-0 flex flex-col min-h-screen">

    <!-- Modal overlay for Name Input -->
    <div id="name-modal" class="fixed inset-0 bg-gray-900/40 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl p-6 w-[360px] flex flex-col gap-4">
            <h2 class="text-xl font-bold">Start your session</h2>
            <p class="text-sm text-gray-600">Enter your name to begin.</p>
            
            <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700">Firstname</label>
                <input type="text" id="input-firstname" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                <p id="error-firstname" class="text-red-500 text-xs mt-1 hidden">Enter a firstname</p>
            </div>
            
            <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700">Lastname</label>
                <input type="text" id="input-lastname" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                <p id="error-lastname" class="text-red-500 text-xs mt-1 hidden">Enter a lastname</p>
            </div>

            <div class="flex justify-end mt-2">
                <button id="btn-start" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded transition">Start</button>
            </div>
        </div>
    </div>

    <!-- Modal overlay for Start Over Confirmation -->
    <div id="reset-modal" class="fixed inset-0 bg-gray-900/60 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl p-6 w-[360px] flex flex-col gap-4">
            <h2 class="text-xl font-bold text-red-600">Start Over?</h2>
            <p class="text-sm text-gray-700">Are you sure you want to start over? All your current questions and scores will be permanently lost.</p>
            <div class="flex justify-end gap-3 mt-2">
                <button id="btn-cancel-reset" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded transition">Cancel</button>
                <button id="btn-confirm-reset" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded transition">Yes, Start Over</button>
            </div>
        </div>
    </div>

    <!-- Sticky Dashboard Top Bar -->
    <div class="sticky top-0 w-full bg-gray-100 border-b border-gray-300 px-4 py-4 z-40 shadow-sm flex flex-col gap-3">
        <div class="flex flex-wrap justify-center gap-6 md:gap-12 w-full">
            <!-- Score Blocks -->
            <div class="flex flex-col items-center w-24">
                <span class="text-[11px] font-semibold text-blue-900 text-center leading-tight h-8">Base<br>conversion</span>
                <span id="score-a" class="text-2xl font-bold text-blue-900">0</span>
            </div>
            <div class="flex flex-col items-center w-24">
                <span class="text-[11px] font-semibold text-purple-900 text-center leading-tight h-8">Binary<br>arithmetic</span>
                <span id="score-b" class="text-2xl font-bold text-purple-900">0</span>
            </div>
            <div class="flex flex-col items-center w-24">
                <span class="text-[11px] font-semibold text-teal-900 text-center leading-tight h-8">Unit<br>conversion</span>
                <span id="score-c" class="text-2xl font-bold text-teal-900">0</span>
            </div>
            <div class="flex flex-col items-center w-24">
                <span class="text-[11px] font-semibold text-orange-900 text-center leading-tight h-8">Number of<br>values</span>
                <span id="score-d" class="text-2xl font-bold text-orange-900">0</span>
            </div>
            <div class="flex flex-col items-center w-24">
                <span class="text-[11px] font-semibold text-green-900 text-center leading-tight h-8"><br>Average</span>
                <span id="score-avg" class="text-2xl font-bold text-green-900">0.00</span>
            </div>
        </div>
        
        <div class="flex items-center max-w-4xl mx-auto w-full px-2">
            <div>
                <span class="text-lg">Student:</span>
                <span id="label-student" class="text-lg font-bold">—</span>
            </div>
            <button id="btn-start-over" class="ml-auto bg-red-100 hover:bg-red-200 text-red-700 text-sm font-semibold py-1.5 px-3 rounded transition hidden">
                Start Over
            </button>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 overflow-auto p-4 md:p-8">
        <div class="max-w-4xl mx-auto flex flex-col gap-4" id="questions-container">
            <!-- Questions dynamically injected here -->
        </div>

        <div class="max-w-4xl mx-auto text-center py-8">
            <button id="btn-load-more" class="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white font-semibold py-2 px-6 rounded transition" disabled>
                Load More Questions
            </button>
        </div>
    </div>

    <script type="mpy">
        import random
        import json
        from pyscript import document, window

        # ==========================================
        # CONSTANTS & CONFIGURATION
        # ==========================================
        QUESTION_TYPES = ("a", "b", "c", "d")
        QUESTION_BATCH_SIZE = 20
        FLOAT_TOLERANCE = 0.01
        REQUIRED_CORRECT_RATIO = 0.75
        STATE_KEY = "cs_maths_state"

        QUESTION_TYPE_DETAILS = {
            "a": {"label": "Base conversion",   "bg_color": "bg-blue-900"},
            "b": {"label": "Binary arithmetic", "bg_color": "bg-purple-900"},
            "c": {"label": "Unit conversion",   "bg_color": "bg-teal-900"},
            "d": {"label": "Number of values",  "bg_color": "bg-orange-900"},
        }

        UNIT_VALUES = {
            "bit": 1, 
            "byte": 8, 
            "kilobyte": 8000,
            "megabyte": 8000000, 
            "gigabyte": 8000000000,
        }
        UNIT_VALUES_BINARY = {
            "bit": 1, 
            "byte": 8, 
            "kilobyte": 8192,
            "megabyte": 8 * 1024 * 1024, 
            "gigabyte": 8 * 1024 * 1024 * 1024,
        }
        UNIT_LABELS = {
            "bit": "bits", 
            "byte": "bytes", 
            "kilobyte": "kilobytes",
            "megabyte": "megabytes", 
            "gigabyte": "gigabytes",
        }

        # ==========================================
        # DATA CLASSES
        # ==========================================
        class AppState:
            def __init__(self):
                self.firstname = ""
                self.lastname = ""
                self.scores = {qt: 0 for qt in QUESTION_TYPES}
                self.questions = []

        class Question:
            def __init__(self, question_type, prompt, validator_type, expected, user_answer=""):
                self.question_type = question_type
                self.prompt = prompt
                self.validator_type = validator_type
                self.expected = expected
                self.user_answer = user_answer

            def to_dict(self):
                return {
                    "q_type": self.question_type,
                    "prompt": self.prompt,
                    "v_type": self.validator_type,
                    "expected": self.expected,
                    "answer": self.user_answer
                }

            @classmethod
            def from_dict(cls, data):
                return cls(
                    data["q_type"],
                    data["prompt"],
                    data["v_type"],
                    data["expected"],
                    data.get("answer", "")
                )

        state = AppState()

        # ==========================================
        # HELPERS & FORMATTERS
        # ==========================================
        def singular_or_plural(count, singular, plural):
            if count == 1:
                return singular
            return plural

        def format_binary(value):
            s = bin(value)[2:]
            while len(s) < 8:
                s = "0" + s
            return s

        def format_hexadecimal(value):
            s = hex(value)[2:].upper()
            if len(s) < 2:
                s = "0" + s
            return s

        def normalise_hexadecimal(value):
            cleaned = value.strip().lower()
            if cleaned.startswith("0x"):
                cleaned = cleaned[2:]
            return cleaned

        def parse_float(value):
            try:
                return float(value.strip())
            except ValueError:
                return None

        def is_close_to_any(value, expected_values):
            for expected in expected_values:
                if abs(value - expected) <= FLOAT_TOLERANCE:
                    return True
            return False

        # ==========================================
        # VALIDATION PARSER
        # ==========================================
        def validate_answer(v_type, expected, answer):
            if not answer:
                return False
            answer = answer.strip()
            
            if v_type == "integer":
                try:
                    return int(answer) == expected
                except ValueError:
                    return False
                    
            elif v_type == "binary_string":
                if len(answer) != 8:
                    return False
                for c in answer:
                    if c != "0" and c != "1":
                        return False
                return answer == expected
                
            elif v_type == "hex_string":
                return normalise_hexadecimal(answer) == expected
                
            elif v_type == "number_list":
                parsed = parse_float(answer)
                
                # Check for integer match first if all expected are whole numbers
                all_int = True
                for v in expected:
                    if float(v) != int(float(v)):
                        all_int = False
                        break
                        
                if all_int:
                    try:
                        int_ans = int(answer)
                        int_expected = []
                        for v in expected:
                            int_expected.append(int(v))
                        if int_ans in int_expected:
                            return True
                    except ValueError:
                        pass
                
                if parsed is None:
                    return False
                return is_close_to_any(parsed, expected)
                
            return False

        # ==========================================
        # GENERATORS (Refactored to return serializable types)
        # ==========================================
        def generate_base_conversion_question():
            value = random.randint(0, 255)
            bases = ["binary", "denary", "hexadecimal"]
            source_base = random.choice(bases)
            target_options = []
            for b in bases:
                if b != source_base:
                    target_options.append(b)
            target_base = random.choice(target_options)

            representations = {
                "binary": format_binary(value),
                "denary": str(value),
                "hexadecimal": format_hexadecimal(value),
            }
            
            if target_base == "binary":
                v_type = "binary_string"
                expected = format_binary(value)
            elif target_base == "denary":
                v_type = "integer"
                expected = value
            else:
                v_type = "hex_string"
                expected = format_hexadecimal(value).lower()
                
            prompt = "Convert " + representations[source_base] + " from " + source_base + " to " + target_base + "."
            return Question("a", prompt, v_type, expected)

        def generate_binary_addition_question():
            term_count = random.choice([2, 3])
            while True:
                values = []
                for _ in range(term_count):
                    values.append(random.randint(0, 255))
                total = sum(values)
                if total <= 255: 
                    break

            binary_values = []
            for value in values:
                binary_values.append(format_binary(value))

            prompt = "Add these 8-bit binary numbers:\n  " + "\n+ ".join(binary_values)
            return Question("b", prompt, "binary_string", format_binary(total))

        def generate_bit_shift_question():
            direction = random.choice(["left", "right"])
            shift = random.randint(1, 3)

            if direction == "left":
                max_value = 255 >> shift
                value = random.randint(0, max_value)
                result = value << shift
            else:
                value = random.randint(0, 255)
                result = value >> shift

            prompt = "Apply a " + direction + " shift by " + str(shift) + " to the 8-bit binary number " + format_binary(value) + ". Give the result in binary."
            return Question("b", prompt, "binary_string", format_binary(result))

        def generate_binary_arithmetic_question():
            generators = [generate_binary_addition_question, generate_bit_shift_question]
            gen = random.choice(generators)
            return gen()

        def generate_unit_conversion_question():
            unit_keys = list(UNIT_VALUES.keys())
            source_unit = random.choice(unit_keys)
            target_options = []
            for u in unit_keys:
                if u != source_unit:
                    target_options.append(u)
            target_unit = random.choice(target_options)

            amount = random.randint(1, 500)

            decimal_result = amount * UNIT_VALUES[source_unit] / UNIT_VALUES[target_unit]
            binary_result = amount * UNIT_VALUES_BINARY[source_unit] / UNIT_VALUES_BINARY[target_unit]

            prompt = "Convert " + str(amount) + " " + UNIT_LABELS[source_unit] + " to " + UNIT_LABELS[target_unit] + ". You may use either base-10 or base-2 conventions."
            return Question("c", prompt, "number_list", [decimal_result, binary_result])

        def generate_bit_capacity_question():
            bits = random.randint(1, 8)
            bit_label = singular_or_plural(bits, "bit", "bits")
            prompt = "How many different values can be represented using " + str(bits) + " " + bit_label + "?"
            return Question("d", prompt, "integer", 2**bits)

        def generate_denary_digit_capacity_question():
            digits = random.randint(1, 6)
            digit_label = singular_or_plural(digits, "digit", "digits")
            prompt = "How many different values can be represented using " + str(digits) + " denary " + digit_label + "?"
            return Question("d", prompt, "integer", 10**digits)

        def generate_bit_highest_value_question():
            bits = random.randint(1, 8)
            bit_label = singular_or_plural(bits, "bit", "bits")
            prompt = "What is the highest value that can be represented with " + str(bits) + " " + bit_label + "?"
            return Question("d", prompt, "integer", 2**bits - 1)

        def generate_denary_highest_value_question():
            digits = random.randint(1, 6)
            digit_label = singular_or_plural(digits, "digit", "digits")
            prompt = "What is the highest value that can be represented with " + str(digits) + " denary " + digit_label + "?"
            return Question("d", prompt, "integer", 10**digits - 1)

        def generate_capacity_question():
            if random.random() < 0.5:
                gen = random.choice([generate_bit_capacity_question, generate_denary_digit_capacity_question])
            else:
                gen = random.choice([generate_bit_highest_value_question, generate_denary_highest_value_question])
            return gen()

        QUESTION_GENERATORS = {
            "a": generate_base_conversion_question,
            "b": generate_binary_arithmetic_question,
            "c": generate_unit_conversion_question,
            "d": generate_capacity_question,
        }

        # ==========================================
        # STATE MANAGEMENT (LocalStorage)
        # ==========================================
        def save_state():
            if not state.firstname:
                return
            
            q_dicts = []
            for q in state.questions:
                q_dicts.append(q.to_dict())
                
            data = {
                "firstname": state.firstname,
                "lastname": state.lastname,
                "questions": q_dicts
            }
            window.localStorage.setItem(STATE_KEY, json.dumps(data))

        def load_state():
            raw = window.localStorage.getItem(STATE_KEY)
            if not raw:
                return False
                
            try:
                data = json.loads(raw)
                state.firstname = data.get("firstname", "")
                state.lastname = data.get("lastname", "")
                
                state.questions = []
                for q_data in data.get("questions", []):
                    state.questions.append(Question.from_dict(q_data))
                    
                return True
            except Exception:
                return False

        # ==========================================
        # UI / DOM MANIPULATION
        # ==========================================
        def recalculate_scores():
            for qt in QUESTION_TYPES:
                state.scores[qt] = 0
                
            for q in state.questions:
                if validate_answer(q.validator_type, q.expected, q.user_answer):
                    state.scores[q.question_type] += 1

        def refresh_dashboard():
            recalculate_scores()
            
            name_display = (state.firstname + " " + state.lastname).strip()
            if name_display:
                document.getElementById("label-student").innerText = name_display
                document.getElementById("btn-start-over").classList.remove("hidden")
            else:
                document.getElementById("label-student").innerText = "—"
                document.getElementById("btn-start-over").classList.add("hidden")

            total_score = 0
            for qt in QUESTION_TYPES:
                score = state.scores[qt]
                total_score += score
                document.getElementById("score-" + qt).innerText = str(score)

            if len(QUESTION_TYPES) > 0:
                avg = total_score / len(QUESTION_TYPES)
                document.getElementById("score-avg").innerText = "{:.2f}".format(avg)

            required_correct = int(len(state.questions) * REQUIRED_CORRECT_RATIO)
            btn = document.getElementById("btn-load-more")
            
            if total_score < required_correct:
                btn.disabled = True
            else:
                btn.disabled = False

        def create_question_element(question):
            bg_color = QUESTION_TYPE_DETAILS[question.question_type]["bg_color"]

            row = document.createElement("div")
            row.className = "flex flex-col md:flex-row md:items-center gap-4 p-4 border border-gray-200 rounded-xl bg-white shadow-sm"

            bar = document.createElement("div")
            bar.className = "hidden md:block w-2 h-14 rounded-full opacity-80 " + bg_color

            prompt_div = document.createElement("div")
            prompt_div.className = "flex-1 text-[17px] font-semibold whitespace-pre-wrap pl-2 leading-relaxed"
            prompt_div.innerText = question.prompt

            input_field = document.createElement("input")
            input_field.type = "text"
            input_field.placeholder = "Type answer"
            input_field.className = "w-full md:w-48 p-2 px-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-base transition-colors"
            input_field.value = question.user_answer

            row.append(bar, prompt_div, input_field)

            def apply_style(is_correct):
                if is_correct:
                    input_field.classList.add("bg-green-100", "border-green-500", "text-green-900")
                    input_field.classList.remove("border-gray-300")
                else:
                    input_field.classList.remove("bg-green-100", "border-green-500", "text-green-900")
                    input_field.classList.add("border-gray-300")

            # Apply initial styling on load
            apply_style(validate_answer(question.validator_type, question.expected, question.user_answer))

            def on_input(e):
                question.user_answer = input_field.value
                save_state()
                refresh_dashboard()
                
                # Check style for this specific row
                current_is_correct = validate_answer(question.validator_type, question.expected, question.user_answer)
                apply_style(current_is_correct)
                        
            input_field.addEventListener("input", on_input)
            return row

        def append_questions(count):
            container = document.getElementById("questions-container")
            for _ in range(count):
                q_type = random.choice(QUESTION_TYPES)
                question = QUESTION_GENERATORS[q_type]()
                state.questions.append(question)
                
                row_el = create_question_element(question)
                container.append(row_el)
                
            save_state()
            refresh_dashboard()

        # ==========================================
        # EVENT LISTENERS & INITIALIZATION
        # ==========================================
        def handle_load_more(e):
            append_questions(QUESTION_BATCH_SIZE)

        def start_session(e):
            fname_input = document.getElementById("input-firstname")
            lname_input = document.getElementById("input-lastname")
            fname = fname_input.value.strip()
            lname = lname_input.value.strip()

            err_fname = document.getElementById("error-firstname")
            err_lname = document.getElementById("error-lastname")

            if not fname: err_fname.classList.remove("hidden")
            else: err_fname.classList.add("hidden")
            
            if not lname: err_lname.classList.remove("hidden")
            else: err_lname.classList.add("hidden")

            if fname and lname:
                state.firstname = fname
                state.lastname = lname
                document.getElementById("name-modal").classList.add("hidden")
                
                if len(state.questions) == 0:
                    append_questions(QUESTION_BATCH_SIZE)
                else:
                    save_state()
                    refresh_dashboard()

        def prompt_reset(e):
            document.getElementById("reset-modal").classList.remove("hidden")

        def cancel_reset(e):
            document.getElementById("reset-modal").classList.add("hidden")

        def confirm_reset(e):
            window.localStorage.removeItem(STATE_KEY)
            state.firstname = ""
            state.lastname = ""
            state.questions = []
            
            document.getElementById("questions-container").innerHTML = ""
            document.getElementById("input-firstname").value = ""
            document.getElementById("input-lastname").value = ""
            
            document.getElementById("reset-modal").classList.add("hidden")
            document.getElementById("name-modal").classList.remove("hidden")
            refresh_dashboard()

        # Wire up buttons
        document.getElementById("btn-start").onclick = start_session
        document.getElementById("btn-load-more").onclick = handle_load_more
        document.getElementById("btn-load-more").innerText = "Load " + str(QUESTION_BATCH_SIZE) + " more questions"
        
        document.getElementById("btn-start-over").onclick = prompt_reset
        document.getElementById("btn-cancel-reset").onclick = cancel_reset
        document.getElementById("btn-confirm-reset").onclick = confirm_reset

        # Boot routine
        if load_state():
            # Session exists! Hydrate UI.
            container = document.getElementById("questions-container")
            for q in state.questions:
                container.append(create_question_element(q))
            refresh_dashboard()
        else:
            # New user
            document.getElementById("name-modal").classList.remove("hidden")

    </script>
</body>
</html>
