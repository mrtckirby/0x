    <style>
        body { font-family: 'Courier New', Courier, monospace; }
        body { transition: opacity 0.3s; }
        
        /* Streak Animation & Glow Effects */
        .glow-text {
            text-shadow: 0 0 10px currentColor, 0 0 18px currentColor;
        }
        
        .pop-anim {
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.5); }
            100% { transform: scale(1); }
        }
        
        /* Completion Animations */
        .tick-anim svg {
            animation: tick-grow-fade 1.0s ease-out forwards;
        }
        
        @keyframes tick-grow-fade {
            0% { transform: scale(0.5); opacity: 0; }
            15% { transform: scale(1.5); opacity: 0.6; }
            100% { transform: scale(3.5); opacity: 0; }
        }

        .row-exit {
            animation: slide-out 0.4s ease-in forwards;
            overflow: hidden;
            pointer-events: none;
        }

        @keyframes slide-out {
            0% { opacity: 1; max-height: 450px; margin-bottom: 1rem; }
            100% { opacity: 0; max-height: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; border-width: 0; }
        }

        .score-val {
            display: inline-block;
            transition: text-shadow 0.3s ease;
        }

        .score-trigger { cursor: pointer; border-radius: 0.375rem; }
        .score-trigger:hover { background: #e5e7eb; }
        .score-trigger:focus-visible { outline: 2px solid #2563eb; outline-offset: 3px; }
        .score-trigger.focus-muted { filter: grayscale(1); opacity: 0.55; }
        .focus-trigger { font-size: 0.7rem; color: #4b5563; text-decoration: underline; cursor: pointer; }
        .focus-trigger:focus-visible { outline: 2px solid #2563eb; outline-offset: 3px; }
        .scorecard {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            max-width: none;
            max-height: none;
            margin: 0;
            border: 0;
            padding: 1.25rem;
            background: white;
            color: #111827;
            overflow: auto;
        }
        .scorecard::backdrop { background: rgba(17, 24, 39, 0.35); }
        .scorecard-header { display: flex; justify-content: space-between; align-items: start; gap: 1rem; }
        .scorecard h2 { font-size: 1.25rem; font-weight: bold; }
        .scorecard-close { font-size: 1.75rem; line-height: 1; cursor: pointer; padding: 0.25rem; }
        .scorecard-close:focus-visible { outline: 2px solid #2563eb; }
        .scorecard table { border-collapse: collapse; width: 100%; margin-top: 1rem; font-size: 0.875rem; }
        .scorecard th, .scorecard td { padding: 0.5rem 0.25rem; border-bottom: 1px solid #e5e7eb; }
        .scorecard th { text-align: left; }
        .scorecard .score-number { text-align: right; white-space: nowrap; }
        .scorecard .category-heading th { padding-top: 1rem; color: var(--cat-text); }
        .scorecard .advanced-label { color: #6b7280; font-size: 0.75rem; }
        .scorecard .focus-trigger { display: block; margin-top: 0.25rem; }
        @media (min-width: 768px) {
            .scorecard {
                inset: auto;
                width: min(440px, calc(100vw - 32px));
                height: auto;
                max-height: calc(100vh - var(--scorecard-top) - 16px);
                top: var(--scorecard-top);
                left: var(--scorecard-left);
                overflow: visible;
                padding: 0;
                border: 1px solid #d1d5db;
                border-radius: 0.75rem;
                box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
            }
            .scorecard-wide { width: min(680px, calc(100vw - 32px)); }
            .scorecard::before {
                content: "";
                position: absolute;
                top: -9px;
                left: var(--scorecard-arrow);

                height: 16px;
                background: white;
                border-top: 1px solid #d1d5db;
                border-left: 1px solid #d1d5db;
                transform: translateX(-50%) rotate(45deg);
            }
            .scorecard-content { padding: 1.25rem; max-height: inherit; overflow: auto; }
        }

    <script type="py">
        import random
        import json
        from itertools import combinations
        from pyscript import document, window
        from pyodide.ffi import create_once_callable, create_proxy

        # ==========================================
        # CONSTANTS & CONFIGURATION
        # ==========================================
        QUESTION_BATCH_SIZE = 10  # Initial load and active screen size
        RELATIVE_TOLERANCE = 0.02
        ABSOLUTE_TOLERANCE = 1e-6
        STATE_KEY = "cs_maths_state"
        
        CALLBACK_PROXIES = []
        QUESTION_CLEANUPS = []
        ALLOW_MULTI_COLUMN_CARRIES = False

        def hold_proxy(proxy):
            CALLBACK_PROXIES.append(proxy)
            return proxy

        def destroy_proxy(proxy):
            if proxy is None:
                return
            try:
                proxy.destroy()
            except Exception:
                pass

        MASTER_CATEGORIES = (
            "base_conversion",
            "binary_arithmetic",
            "unit_conversion",
            "operators",
            "bit_patterns",
        )

        LEGACY_TYPE_MAP = {
            "a": "base_conversion",
            "c": "unit_conversion",
            "d": "number_of_values",
        }

        UNIT_VALUES = {
            "bit": 1, 
            "byte": 8, 
            "kilobyte": 8000,
            "megabyte": 8000000, 
            "gigabyte": 8000000000,
        }
        UNIT_VALUES_BINARY = {
            "bit": 1, 
            "byte": 8, 
            "kilobyte": 8192,
            "megabyte": 8 * 1024 * 1024, 
            "gigabyte": 8 * 1024 * 1024 * 1024,
        }
        UNIT_LABELS = {
            "bit": "bits", 
            "byte": "bytes", 
            "kilobyte": "kilobytes",
            "megabyte": "megabytes", 
            "gigabyte": "gigabytes",
        }
        MAX_NICE_GENERATION_ATTEMPTS = 25

        def build_nice_pool():
            bases = [8, 80, 800, 4, 40, 400]
            return sorted({base * multiple for base in bases for multiple in range(1, 13)})

        NICE_POOL = build_nice_pool()

        # ==========================================
        # DATA CLASSES & STATE
        # ==========================================
        class AppState:
            def __init__(self):
                self.firstname = ""
                self.lastname = ""
                self.advanced_mode = False
                self.focus_category = None
                self.focus_question_type = None
                self.last_active_date = ""
                self.daily_scores = {}
                self.all_time_scores = {}

        class QuestionDTO:
            def __init__(self, question_type, prompt, validator_type, expected, grid=None):
                self.question_type = question_type
                self.prompt = prompt
                self.validator_type = validator_type
                self.expected = expected
                self.grid = grid  # optional graphic: list of rows of hex colours

        state = AppState()

        # ==========================================
        # HELPERS & FORMATTERS
        # ==========================================
        def format_binary(value):
            s = bin(value)[2:]
            while len(s) < 8:
                s = "0" + s
            return s

        def format_hexadecimal(value):
            s = hex(value)[2:].upper()
            if len(s) < 2:
                s = "0" + s
            return s

        def normalise_hexadecimal(value):
            cleaned = value.strip().lower()
            if cleaned.startswith("0x"):
                cleaned = cleaned[2:]
            return cleaned

        def parse_float(value):
            try:
                return float(value.strip())
            except ValueError:
                return None

        def is_close_to_any(value, expected_values):
            for expected in expected_values:
                diff = abs(value - expected)
                rel_target = RELATIVE_TOLERANCE * abs(expected)
                if diff <= max(rel_target, ABSOLUTE_TOLERANCE):
                    return True
            return False

        def has_multi_column_carry(values):
            carry = 0
            for i in range(8):
                bit_sum = carry
                for v in values:
                    bit_sum += (v >> i) & 1
                if bit_sum > 2:
                    return True
                carry = bit_sum >> 1
            return False

        def whole_number_or_none(value):
            rounded = round(value)
            if abs(value - rounded) <= ABSOLUTE_TOLERANCE:
                return int(rounded)
            return None

        def is_realistic_data_transfer_value(value_type, unit, value):
            if value_type == "time":
                return 1 <= value <= 3600
            if value_type == "size":
                if unit == "MB":
                    return 1 <= value <= 1000
                return 1 <= value <= 20
            if value_type == "speed":
                if unit == "Mb/s":
                    return 1 <= value <= 1000
                return 1 <= value <= 20
            return False

        def is_realistic_unit_conversion_amount(unit, value):
            if unit == "bit":
                return 4 <= value <= 9600
            if unit == "gigabyte":
                return 1 <= value <= 20
            return 1 <= value <= 1000

        def parse_dotted_decimal(value):
            """Parses a dotted-decimal address into a tuple of 4 ints, or None. Tolerates whitespace and leading zeroes."""
            parts = [p.strip() for p in value.strip().split(".")]
            if len(parts) != 4:
                return None
            octets = []
            for p in parts:
                if p == "" or any(c not in "0123456789" for c in p):
                    return None
                octets.append(int(p))
            return tuple(octets)

        def parse_cidr_prefix(value):
            """Parses a CIDR prefix with or without a leading slash, or None."""
            cleaned = value.strip()
            if cleaned.startswith("/"):
                cleaned = cleaned[1:].strip()
            if cleaned == "" or any(c not in "0123456789" for c in cleaned):
                return None
            return int(cleaned)

        def focus_next_available_input(current_input):
            """Advances cursor smoothly to the next available input below."""
            inputs = document.querySelectorAll(".question-row input[type='text']")
            
            curr_idx = -1
            for i in range(inputs.length):
                if inputs[i].isSameNode(current_input):
                    curr_idx = i
                    break
            
            if curr_idx != -1:
                for i in range(curr_idx + 1, inputs.length):
                    if not inputs[i].disabled:
                        inputs[i].focus()
                        return

        # ==========================================
        # STREAK CALCULATIONS
        # ==========================================
        def get_streak_level(score, initial=3):
            if score < initial:
                return 0
            level = 0
            target = initial
            gap = initial
            while score >= target:
                level += 1
                gap *= 2
                target += gap
            return level

        def get_current_levels():
            daily_master_scores = {mc: 0 for mc in MASTER_CATEGORIES}
            
            today = window.Date.new().toDateString()
            if state.last_active_date == today:
                for q_type, count in state.daily_scores.items():
                    if q_type in QUESTION_CONFIG:
                        master = QUESTION_CONFIG[q_type]["master"]
                        daily_master_scores[master] += count
            
            levels = {}
            for mc in MASTER_CATEGORIES:
                levels[mc] = get_streak_level(daily_master_scores[mc], 3)
                
            daily_avg = sum(daily_master_scores.values()) / len(MASTER_CATEGORIES)
            levels["avg"] = get_streak_level(daily_avg, 3)
            
            return levels

        def trigger_pop(el_id):
            el = document.getElementById(el_id)
            if not el: return
            el.classList.remove("pop-anim")
            _ = el.offsetWidth 
            el.classList.add("pop-anim")

        # ==========================================
        # VALIDATION PARSER
        # ==========================================
        def validate_answer(v_type, expected, answer):
            if not answer: return False
            answer = answer.strip()
            
            if v_type == "integer":
                try: return int(answer) == expected
                except ValueError: return False
                    
            elif v_type == "binary_string":
                if len(answer) != 8: return False
                for c in answer:
                    if c != "0" and c != "1": return False
                return answer == expected

            elif v_type == "binary_4bit":
                if len(answer) != 4: return False
                for c in answer:
                    if c != "0" and c != "1": return False
                return answer == expected
                
            elif v_type == "hex_string":
                return normalise_hexadecimal(answer) == expected
                
            elif v_type == "boolean":
                ans_lower = answer.lower()
                if expected == True:
                    return ans_lower == "true" or ans_lower == "1"
                else:
                    return ans_lower == "false" or ans_lower == "0"
                    
            elif v_type == "real_binary":
                cleaned_ans = answer.replace(" ", "")
                return cleaned_ans == expected
                
            elif v_type == "ip_address":
                return parse_dotted_decimal(answer) == expected

            elif v_type == "cidr_prefix":
                return parse_cidr_prefix(answer) == expected

            elif v_type == "number_list":
                parsed = parse_float(answer)
                all_int = True
                for v in expected:
                    if float(v) != int(float(v)):
                        all_int = False
                        break
                        
                if all_int:
                    try:
                        int_ans = int(answer)
                        int_expected = [int(v) for v in expected]
                        if int_ans in int_expected:
                            return True
                    except ValueError:
                        pass
                
                if parsed is None: return False
                return is_close_to_any(parsed, expected)
                
            return False

        # ==========================================
        # GENERATORS
        # ==========================================
        def generate_base_conversion_question():
            value = random.randint(0, 255)
            bases = ["binary", "denary", "hexadecimal"]
            source_base = random.choice(bases)
            target_options = [b for b in bases if b != source_base]
            target_base = random.choice(target_options)

            representations = {
                "binary": format_binary(value),
                "denary": str(value),
                "hexadecimal": format_hexadecimal(value),
            }
            
            if target_base == "binary":
                v_type = "binary_string"
                expected = format_binary(value)
            elif target_base == "denary":
                v_type = "integer"
                expected = value
            else:
                v_type = "hex_string"
                expected = format_hexadecimal(value).lower()
                
            prompt = "Convert " + representations[source_base] + " from " + source_base + " to " + target_base + "."
            return QuestionDTO("base_conversion", prompt, v_type, expected)

        def generate_twos_comp_bin_to_den():
            value = random.randint(-128, -1)
            bin_str = format_binary(value & 0xFF)
            prompt = "Convert the Two's Complement 8-bit binary number " + bin_str + " to denary."

        def generate_boolean_question():
            def comparison():
                op = random.choice(["<", ">", "=", "≤", "≥"])
                a = random.randint(1, 30)
                b = a if random.random() < 0.3 else random.randint(1, 30)
                if op == "<": result = a < b
                elif op == ">": result = a > b
                elif op == "=": result = a == b
                elif op == "≤": result = a <= b
                else: result = a >= b
                return "(" + str(a) + " " + op + " " + str(b) + ")", result

            def apply_operator(left, right, op):
                if op == "AND": result = left and right
                elif op == "OR": result = left or right
                else: result = left != right
                return result

            comparisons = [comparison() for _ in range(random.randint(2, 4))]
            for i, (expression, result) in enumerate(comparisons):
                if random.random() < 0.3:
                    comparisons[i] = ("NOT " + expression, not result)

            def combine(left, right, op):
                return "(" + left[0] + " " + op + " " + right[0] + ")", apply_operator(left[1], right[1], op)

            expression = combine(comparisons[0], comparisons[1], random.choice(["AND", "OR", "XOR"]))
            if len(comparisons) == 3:
                root = comparisons[2]
                op = random.choice(["AND", "OR", "XOR"])
                expression = (expression[0] + " " + op + " " + root[0],
                              apply_operator(expression[1], root[1], op))

                expression = (expression[0] + " " + op + " " + right[0],

        # Bit patterns (IPv4 addressing). Prefixes /31 and /32 are excluded because their usable-host semantics vary.
        IP_MIN_PREFIX = 8
        IP_MAX_PREFIX = 30

        def prefix_to_mask(prefix):
            return (0xFFFFFFFF << (32 - prefix)) & 0xFFFFFFFF

        def int_to_dotted(value):
            return ".".join(str((value >> shift) & 255) for shift in (24, 16, 8, 0))

        def dotted_to_tuple(value):
            return tuple((value >> shift) & 255 for shift in (24, 16, 8, 0))

        def generate_ip_with_prefix(min_prefix=IP_MIN_PREFIX, max_prefix=IP_MAX_PREFIX):
            """Random unicast IPv4 address and prefix whose host bits are neither all 0s nor all 1s."""
            prefix = random.randint(min_prefix, max_prefix)
            mask = prefix_to_mask(prefix)
            while True:
                first = random.randint(1, 223)
                if first == 127:
                    continue
                ip = (first << 24) | random.getrandbits(24)
                host = ip & ~mask & 0xFFFFFFFF
                if host != 0 and host != (~mask & 0xFFFFFFFF):
                    return ip, prefix

        def generate_ip_network_address_question():
            ip, prefix = generate_ip_with_prefix()
            prompt = "Given the IP address " + int_to_dotted(ip) + "/" + str(prefix) + ", state the Network Address in dotted-decimal notation."
            expected = dotted_to_tuple(ip & prefix_to_mask(prefix))
            return QuestionDTO("ip_network_address", prompt, "ip_address", expected)

        # Representing images: Okabe-Ito based master palette (colourblind-safe).
        IMAGE_MASTER_PALETTE = [
            "#000000", "#FFFFFF", "#808080", "#F0E442", "#56B4E9",
            "#E69F00", "#009E73", "#CC79A7", "#D55E00",
        ]
        IMAGE_MIN_SIZE = 2
        IMAGE_MAX_SIZE = 8
        IMAGE_MAX_CELLS = 16
        # Bit depth -> (fewest, most) colours needing that depth; depth = (n - 1).bit_length().
        IMAGE_DEPTH_RANGES = {1: (2, 2), 2: (3, 4), 3: (5, 8), 4: (9, 9)}
        # Pairs that are hard to tell apart. Soft rule: of all C(9, n) palettes of size n, pick
        # at random among those with the fewest flagged pairs. That is 0 pairs up to n=6 (only 6
        # colours can avoid every pair); larger palettes include only the unavoidable ones.
        IMAGE_SIMILAR_PAIRS = [
            frozenset(["#E69F00", "#D55E00"]),
            frozenset(["#808080", "#009E73"]),
            frozenset(["#CC79A7", "#808080"]),
            frozenset(["#FFFFFF", "#F0E442"]),
        ]

        def count_similar_pairs(palette):
            return sum(1 for pair in IMAGE_SIMILAR_PAIRS if pair <= set(palette))

        def choose_image_palette(n):
            options = []
            for combo in combinations(IMAGE_MASTER_PALETTE, n):
                options.append((count_similar_pairs(combo), combo))
            fewest = min(count for count, combo in options)
            return list(random.choice([combo for count, combo in options if count == fewest]))

        def generate_image_grid():
            # Landscape only (height never exceeds width) and at most IMAGE_MAX_CELLS pixels.
            w = random.randint(IMAGE_MIN_SIZE, IMAGE_MAX_SIZE)
            h = random.randint(IMAGE_MIN_SIZE, min(w, IMAGE_MAX_CELLS // w))
            cells = w * h
            depths = [d for d, (low, high) in IMAGE_DEPTH_RANGES.items() if low <= cells]
            low, high = IMAGE_DEPTH_RANGES[random.choice(depths)]
            n = random.randint(low, min(high, cells))
            palette = choose_image_palette(n)
            # One of each colour in distinct cells, the rest random, then shuffle.
            colours = list(palette)
            while len(colours) < cells:
                colours.append(random.choice(palette))
            random.shuffle(colours)
            return [colours[r * w:(r + 1) * w] for r in range(h)]

        def generate_image_representation_question():
            grid = generate_image_grid()
            h = len(grid)
            w = len(grid[0])
            distinct = len(set(c for row in grid for c in row))
            depth = (distinct - 1).bit_length()
            size_bits = depth * w * h
            common = " The image is uncompressed and the same number of bits is used for every pixel, using the minimum number of bits per pixel."
            if random.random() < 0.5:
                prompt = "What is the minimum colour depth needed to represent the image shown?" + common + " Give your answer in bits."
                return QuestionDTO("image_representation", prompt, "integer", depth, grid)
            if size_bits % 8 == 0 and random.random() < 0.5:
                unit, expected = "bytes", size_bits // 8
            else:
                unit, expected = "bits", size_bits
            prompt = "What is the minimum file size of the image shown, ignoring any metadata?" + common + " Give your answer in " + unit + "."

        STEER_STRENGTH = 0.5
        STEER_MIN = 0.4
        STEER_MAX = 2.5
        STEER_RAMP_TOTAL = 20

        def steer_multipliers(scores_by_master):
            n = len(MASTER_CATEGORIES)
            total = sum(scores_by_master.get(mc, 0) for mc in MASTER_CATEGORIES)
            if total <= 0:
                return {mc: 1.0 for mc in MASTER_CATEGORIES}
            strength = STEER_STRENGTH * min(1.0, total / STEER_RAMP_TOTAL)
            mult = {}
            for mc in MASTER_CATEGORIES:
                share = scores_by_master.get(mc, 0) / total
                deficit = (1.0 / n) - share
                mult[mc] = max(STEER_MIN, min(STEER_MAX, 1.0 + strength * deficit * n))
            return mult

        def weighted_pick(choices, weights):
            r = random.random() * sum(weights)
            cumulative = 0.0
            for choice, weight in zip(choices, weights):
                cumulative += weight
                if r <= cumulative:
                    return choice
            return choices[-1]

        def choose_weighted_question_type():
            by_master = {}
            for q_type, config in QUESTION_CONFIG.items():
                if config["advanced"] and not state.advanced_mode:
                    continue
                if state.focus_category and config["master"] != state.focus_category:
                    continue
                if state.focus_question_type and q_type != state.focus_question_type:
                    continue
                by_master.setdefault(config["master"], []).append(q_type)

            scores = {mc: 0 for mc in MASTER_CATEGORIES}
            for sub_type, count in state.all_time_scores.items():
                if sub_type in QUESTION_CONFIG:
                    scores[QUESTION_CONFIG[sub_type]["master"]] += count
            mult = steer_multipliers(scores)

            masters = list(by_master.keys())
            master = weighted_pick(masters, [mult.get(mc, 1.0) for mc in masters])
            types = by_master[master]
            return weighted_pick(types, [QUESTION_CONFIG[t]["weight"] for t in types])

        def save_state():
            if not state.firstname:
                return
            data = {
                "firstname": state.firstname,
                "lastname": state.lastname,
                "advanced_mode": state.advanced_mode,
                "focus_category": state.focus_category,
                "focus_question_type": state.focus_question_type,
                "last_active_date": state.last_active_date,
                "daily_scores": state.daily_scores,
                "all_time_scores": state.all_time_scores
            }
            window.localStorage.setItem(STATE_KEY, json.dumps(data))

        def load_state():
            raw = window.localStorage.getItem(STATE_KEY)
            if not raw:
                return False
                
            try:
                data = json.loads(raw)
                state.firstname = data.get("firstname", "")
                state.lastname = data.get("lastname", "")
                state.advanced_mode = data.get("advanced_mode", False)
                focus_category = data.get("focus_category")
                if focus_category == "number_of_values":
                    focus_category = "base_conversion"
                state.focus_category = focus_category if focus_category in MASTER_CATEGORIES else None
                focus_type = data.get("focus_question_type")
                if (isinstance(focus_type, str) and focus_type in QUESTION_CONFIG
                        and state.focus_category == QUESTION_CONFIG[focus_type]["master"]
                        and (state.advanced_mode or not QUESTION_CONFIG[focus_type]["advanced"])):
                    state.focus_question_type = focus_type
                else:
                    state.focus_question_type = None
                
                document.getElementById("toggle-advanced-top").checked = state.advanced_mode
                document.getElementById("toggle-advanced-modal").checked = state.advanced_mode
                
                today = window.Date.new().toDateString()
                
                if "questions" in data:
                    state.last_active_date = today
                    state.all_time_scores = {}
                    state.daily_scores = {}
                    
                    for q_data in data["questions"]:
                        q_type = q_data.get("q_type")
                        if q_type in LEGACY_TYPE_MAP:
                            q_type = LEGACY_TYPE_MAP[q_type]
                        elif q_type == "b":
                            prompt = q_data.get("prompt", "")
                            if "shift by" in prompt.lower() or "discarding any remainder" in prompt.lower() or prompt.startswith("Multiply the 8-bit binary number"):
                                q_type = "binary_shift"
                            else:
                                q_type = "binary_addition"
                                
                        awarded = q_data.get("awarded")
                        if awarded:
                            state.all_time_scores[q_type] = state.all_time_scores.get(q_type, 0) + 1
                            if awarded == today:
                                state.daily_scores[q_type] = state.daily_scores.get(q_type, 0) + 1
                else:
                    state.last_active_date = data.get("last_active_date", "")
                    state.daily_scores = data.get("daily_scores", {})
                    state.all_time_scores = data.get("all_time_scores", {})
                    
                    if state.last_active_date != today:
                        state.last_active_date = today
                        state.daily_scores = {}

                save_state()
                return True
            except Exception:
                return False

            tick_overlay.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="w-20 h-20 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>'

            input_wrapper.append(input_field, tick_overlay)
            row.append(bar, prompt_div, input_wrapper)

            def hold_row_proxy(proxy):
                row_callback_proxies.append(proxy)
                return proxy

            def cleanup_row_proxies():
                for timeout in row_timeouts:
                    window.clearTimeout(timeout)
                row_timeouts.clear()
                try:
                    if input_listener_proxy is not None:
                        input_field.removeEventListener("input", input_listener_proxy)
                except Exception:
                    pass

                while row_callback_proxies:
                    destroy_proxy(row_callback_proxies.pop())
                if cleanup_row_proxies in QUESTION_CLEANUPS:
                    QUESTION_CLEANUPS.remove(cleanup_row_proxies)

            QUESTION_CLEANUPS.append(cleanup_row_proxies)

            def on_input(e):
                ans = input_field.value
                is_correct = validate_answer(question_dto.validator_type, question_dto.expected, ans)
                
                if is_correct:
                    row.classList.add("z-50")
                    
                    input_field.disabled = True
                    input_field.classList.remove("border-gray-300")
                    input_field.classList.add("border-green-500", "text-green-900")
                    
                    today = window.Date.new().toDateString()
                    if state.last_active_date != today:
                        state.last_active_date = today
                        state.daily_scores = {}
                        
                    old_levels = get_current_levels()
                    
                    state.daily_scores[q_type] = state.daily_scores.get(q_type, 0) + 1
                    state.all_time_scores[q_type] = state.all_time_scores.get(q_type, 0) + 1
                    save_state()
                    
                    new_levels = get_current_levels()
                    refresh_dashboard()
                    
                    if new_levels[master] > old_levels[master]:
                        trigger_pop("score-" + master + "-today")
                    if new_levels["avg"] > old_levels["avg"]:
                        trigger_pop("score-avg-today")
                        
                    tick_overlay.classList.remove("hidden")
                    tick_overlay.classList.add("tick-anim")
                    
                    all_inputs = document.querySelectorAll(".question-row input[type='text']")
                    is_last = False
                    if all_inputs.length > 0 and all_inputs[all_inputs.length - 1].isSameNode(input_field):
                        is_last = True

                    if not is_last:
                        focus_next_available_input(input_field)

                    def remove_and_replace(*args):
                        try:
                            row.parentNode.removeChild(row)
                            append_questions(1)
                            
                            if is_last:
                                container = document.getElementById("questions-container")
                                new_row = container.lastElementChild
                                if new_row:
                                    refreshed_inputs = document.querySelectorAll(".question-row input[type='text']")
                                    if refreshed_inputs.length > 0:
                                        refreshed_inputs[refreshed_inputs.length - 1].focus()
                                    # Safe clean call without dictionary parameter
                                    new_row.scrollIntoView()
                        except Exception:
                            pass
                        finally:
                            cleanup_row_proxies()

                    def slide_out_step(*args):
                        try:
                            row.classList.add("row-exit")
                            row_timeouts.append(window.setTimeout(hold_row_proxy(create_once_callable(remove_and_replace)), 400))
                        except Exception:
                            cleanup_row_proxies()

                    row_timeouts.append(window.setTimeout(hold_row_proxy(create_once_callable(slide_out_step)), 1000))

            input_listener_proxy = hold_row_proxy(create_proxy(on_input))
            input_field.addEventListener("input", input_listener_proxy)
            return row

        def append_questions(count):
            container = document.getElementById("questions-container")
            for _ in range(count):
                q_type = choose_weighted_question_type()

                question_dto = gen_func()

        def clear_questions():
            for cleanup in QUESTION_CLEANUPS[:]:
                cleanup()
            document.getElementById("questions-container").replaceChildren()

        def replace_questions():
            clear_questions()
            append_questions(QUESTION_BATCH_SIZE)

        # ==========================================
        # EVENT LISTENERS & INITIALIZATION
        # ==========================================
        def handle_focus(e):
            category = e.currentTarget.getAttribute("data-focus")
            state.focus_category = None if state.focus_category == category else category
            state.focus_question_type = None
            replace_questions()
            refresh_dashboard()
            save_state()

        def handle_scorecard_focus(e):
            button = e.target.closest("[data-focus-type]")
            if not button:
                return
            q_type = button.getAttribute("data-focus-type")
            if state.focus_question_type == q_type:
                state.focus_category = None
                state.focus_question_type = None
            else:
                state.focus_category = QUESTION_CONFIG[q_type]["master"]
                state.focus_question_type = q_type
            document.getElementById("scorecard").close()
            replace_questions()
            refresh_dashboard()
            save_state()

        def handle_toggle_advanced(e):
            state.advanced_mode = e.target.checked
            document.getElementById("toggle-advanced-modal").checked = state.advanced_mode
            document.getElementById("toggle-advanced-top").checked = state.advanced_mode
            if not state.advanced_mode and state.focus_question_type and QUESTION_CONFIG[state.focus_question_type]["advanced"]:
                state.focus_question_type = None
                replace_questions()
                refresh_dashboard()
            save_state()
            render_scorecard()

        def start_session(e):
            fname_input = document.getElementById("input-firstname")
            lname_input = document.getElementById("input-lastname")
            fname = fname_input.value.strip()
            lname = lname_input.value.strip()

            err_fname = document.getElementById("error-firstname")
            err_lname = document.getElementById("error-lastname")

            if not fname: err_fname.classList.remove("hidden")
            else: err_fname.classList.add("hidden")
            
            if not lname: err_lname.classList.remove("hidden")
            else: err_lname.classList.add("hidden")

            if fname and lname:
                state.firstname = fname
                state.lastname = lname
                document.getElementById("name-modal").classList.add("hidden")
                
                replace_questions()
                refresh_dashboard()
                save_state()

        def prompt_reset(e):
            document.getElementById("reset-modal").classList.remove("hidden")

        def cancel_reset(e):
            document.getElementById("reset-modal").classList.add("hidden")

        def confirm_reset(e):
            window.localStorage.removeItem(STATE_KEY)
            state.firstname = ""
            state.lastname = ""
            state.advanced_mode = False
            state.focus_category = None
            state.focus_question_type = None
            state.daily_scores = {}
            state.all_time_scores = {}
            
            document.getElementById("toggle-advanced-top").checked = False
            document.getElementById("toggle-advanced-modal").checked = False
            
            clear_questions()
            document.getElementById("input-firstname").value = ""
            document.getElementById("input-lastname").value = ""
            
            document.getElementById("reset-modal").classList.add("hidden")
            document.getElementById("name-modal").classList.remove("hidden")
            refresh_dashboard()

        # Wire up buttons and toggles
        scorecard_open_proxy = hold_proxy(create_proxy(open_scorecard))
        for trigger in document.querySelectorAll("[data-scorecard]"):
            trigger.addEventListener("click", scorecard_open_proxy)
        focus_proxy = hold_proxy(create_proxy(handle_focus))
        for trigger in document.querySelectorAll("[data-focus]"):
            trigger.addEventListener("click", focus_proxy)
        document.getElementById("scorecard-close").addEventListener("click", hold_proxy(create_proxy(close_scorecard)))
        document.getElementById("scorecard").addEventListener("click", hold_proxy(create_proxy(scorecard_backdrop_click)))
        document.getElementById("scorecard-scores").addEventListener("click", hold_proxy(create_proxy(handle_scorecard_focus)))
        document.getElementById("scorecard").addEventListener("close", hold_proxy(create_proxy(scorecard_closed)))
        window.addEventListener("resize", hold_proxy(create_proxy(position_scorecard)))
        window.addEventListener("scroll", hold_proxy(create_proxy(position_scorecard)))
        document.getElementById("btn-start").onclick = hold_proxy(create_proxy(start_session))
        toggle_advanced_proxy = hold_proxy(create_proxy(handle_toggle_advanced))
        document.getElementById("toggle-advanced-top").addEventListener("change", toggle_advanced_proxy)
        document.getElementById("toggle-advanced-modal").addEventListener("change", toggle_advanced_proxy)
        
        document.getElementById("btn-start-over").onclick = hold_proxy(create_proxy(prompt_reset))
        document.getElementById("btn-cancel-reset").onclick = hold_proxy(create_proxy(cancel_reset))
        document.getElementById("btn-confirm-reset").onclick = hold_proxy(create_proxy(confirm_reset))

        if load_state():
            replace_questions()
            refresh_dashboard()
        else:
            document.getElementById("name-modal").classList.remove("hidden")

    </script>
</body>
</html>
